<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Inicialização do Firebase (utilize a sua configuração existente)
  const auth = getAuth();
  const db = getFirestore();

  // Variáveis globais do Player e Controle de Progresso
  let ytPlayer = null;
  let progressInterval = null;
  let pendingSubjectId = null;
  let maxWatchedTime = 0;
  let currentVideoLoadedId = null;
  let userProgressCache = {}; // Cache local em memória para evitar leituras excessivas

  // Helper para seleção de elementos do DOM
  const $ = (id) => document.getElementById(id);

  // -----------------------------------------------------------------
  // 1. SINCRONIZAÇÃO DE PROGRESSO COM O FIREBASE FIRESTORE
  // -----------------------------------------------------------------

  // Carrega o progresso salvo na nuvem assim que o usuário se autentica
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await loadUserProgressFromCloud(user.uid);
    } else {
      userProgressCache = {};
      updateOverallProgressUI();
    }
  });

  async function loadUserProgressFromCloud(uid) {
    try {
      const docRef = doc(db, "usersProgress", uid);
      const docSnap = await getDoc(docRef);

      if (docSnap.exists()) {
        userProgressCache = docSnap.data().lessons || {};
      } else {
        userProgressCache = {};
      }
      updateOverallProgressUI();
    } catch (error) {
      console.error("Erro ao carregar progresso da nuvem:", error);
    }
  }

  window.getProgress = () => userProgressCache;

  window.setProgress = async (subId, percent) => {
    const user = auth.currentUser;
    if (!user) return;

    // Atualiza imediatamente em memória
    userProgressCache[subId] = percent;
    updateOverallProgressUI();

    try {
      // Salva no banco de dados
      const docRef = doc(db, "usersProgress", user.uid);
      await setDoc(docRef, {
        lessons: userProgressCache,
        lastUpdated: new Date()
      }, { merge: true });
    } catch (error) {
      console.error("Erro ao salvar progresso na nuvem:", error);
    }
  };

  function updateOverallProgressUI() {
    if (typeof getAllLessons !== 'function') return;
    
    const allLessons = getAllLessons();
    if (!allLessons || allLessons.length === 0) return;

    let totalPercent = 0;
    allLessons.forEach(lesson => {
      totalPercent += (userProgressCache[lesson.id] || 0);
    });

    const overallPercent = Math.min(100, Math.floor(totalPercent / allLessons.length));

    // Atualiza os elementos da barra de progresso do topo
    if ($("overallPercentText")) $("overallPercentText").textContent = `${overallPercent}%`;
    if ($("overallProgressBar")) $("overallProgressBar").style.width = `${overallPercent}%`;
  }

  // -----------------------------------------------------------------
  // 2. YOUTUBE IFRAME API & TRAVA DE AVANÇO
  // -----------------------------------------------------------------

  if (!window.YT) {
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    let firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  }

  window.onYouTubeIframeAPIReady = () => {
    if (pendingSubjectId) {
      window.openSubject(pendingSubjectId);
      pendingSubjectId = null;
    }
  };

  window.closePlayer = () => {
    if (progressInterval) clearInterval(progressInterval);
    if (ytPlayer && typeof ytPlayer.destroy === 'function') {
      ytPlayer.destroy();
      ytPlayer = null;
    }
    if ($("playerArea")) $("playerArea").classList.remove("active");
    if ($("player")) $("player").innerHTML = "";
    activeSubjectId = null;
    maxWatchedTime = 0;
    currentVideoLoadedId = null;
  };

  window.openSubject = (subId) => {
    let sub = getAllLessons().find(s => s.id === subId);
    if (!sub) return;

    if (!sub.playlist) {
      alert("Nenhum link ou playlist cadastrado para esta aula ainda.");
      return;
    }

    if (!window.YT || !window.YT.Player) {
      pendingSubjectId = subId;
      return;
    }

    closePlayer();
    activeSubjectId = subId;
    if ($("playerArea")) $("playerArea").classList.add("active");
    if ($("playerTitle")) $("playerTitle").textContent = `Assistindo: ${sub.materiaTitle} - ${sub.name}`;

    const { videoId, playlistId } = parseYouTubeUrl(sub.playlist);
    const currentSavedPercent = getProgress()[subId] || 0;

    let playerVars = {
      autoplay: 1,
      rel: 0,
      modestbranding: 1
    };

    if (playlistId) {
      playerVars.listType = 'playlist';
      playerVars.list = playlistId;
    }

    ytPlayer = new YT.Player('player', {
      videoId: videoId || undefined,
      playerVars: playerVars,
      events: {
        'onReady': (event) => {
          const duration = ytPlayer.getDuration();
          if (duration > 0 && currentSavedPercent > 0) {
            maxWatchedTime = (currentSavedPercent / 100) * duration;
            ytPlayer.seekTo(maxWatchedTime, true);
          } else {
            maxWatchedTime = 0;
          }
          
          startProgressTracker(subId);
        },
        'onStateChange': (event) => {
          if (ytPlayer && typeof ytPlayer.getVideoData === 'function') {
            const videoData = ytPlayer.getVideoData();
            if (videoData && videoData.video_id !== currentVideoLoadedId) {
              currentVideoLoadedId = videoData.video_id;
              if (maxWatchedTime > ytPlayer.getDuration()) {
                maxWatchedTime = 0;
              }
            }
          }

          if (event.data === YT.PlayerState.PLAYING) {
            startProgressTracker(subId);
          } else if (event.data === YT.PlayerState.PAUSED) {
            if (progressInterval) clearInterval(progressInterval);
          } else if (event.data === YT.PlayerState.ENDED) {
            if (progressInterval) clearInterval(progressInterval);
            if ($("simPercentText")) $("simPercentText").textContent = `100% assistido`;
            if ($("simSlider")) $("simSlider").value = 100;
            setProgress(subId, 100);
          }
        }
      }
    });

    if ($("playerArea")) $("playerArea").scrollIntoView({ behavior: 'smooth' });
  };

  function startProgressTracker(subId) {
    if (progressInterval) clearInterval(progressInterval);

    progressInterval = setInterval(() => {
      if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

      const currentTime = ytPlayer.getCurrentTime();
      const duration = ytPlayer.getDuration();

      if (!duration || duration === 0) return;

      const currentSavedPercent = getProgress()[subId] || 0;
      if (maxWatchedTime === 0 && currentSavedPercent > 0) {
        maxWatchedTime = (currentSavedPercent / 100) * duration;
        ytPlayer.seekTo(maxWatchedTime, true);
      }

      // TRAVA DE AVANÇO: Bloqueia pulo manual além do máximo assistido
      if (currentTime > maxWatchedTime + 1.5) {
        ytPlayer.seekTo(maxWatchedTime, true);
        return;
      }

      if (currentTime > maxWatchedTime) {
        maxWatchedTime = currentTime;
      }

      const percent = Math.min(100, Math.floor((maxWatchedTime / duration) * 100));
      
      if ($("simPercentText")) $("simPercentText").textContent = `${percent}% assistido`;
      if ($("simSlider")) $("simSlider").value = percent;

      const currentProg = getProgress()[subId] || 0;
      // Atualiza na nuvem a cada ganho relevante de porcentagem (2% ou mais)
      if (percent >= currentProg + 2 || percent === 100) {
        setProgress(subId, percent);
      }
    }, 500);
  }
</script>
</body>
</html>
