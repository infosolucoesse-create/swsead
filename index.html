<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Cursos</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #3b82f6;
      --danger: #ef4444;
      --border-color: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #2563eb;
      --danger: #dc2626;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; transition: background-color 0.3s, color 0.3s; }
    .container { max-width: 900px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .role-badge { background-color: var(--accent); color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }

    .overall-progress { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .progress-bar-bg { background-color: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { background: linear-gradient(90deg, #10b981, #3b82f6); height: 100%; width: 0%; transition: width 0.3s ease; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-bar { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); }

    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--border-color); color: var(--text-main); }
    .btn-danger { background-color: var(--danger); color: white; }

    .module { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
    .module-toggle { width: 100%; text-align: left; padding: 15px; background: none; border: none; color: var(--text-main); font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .module-toggle:hover { background-color: rgba(255, 255, 255, 0.03); }
    .subjects { display: none; padding: 10px 15px; border-top: 1px solid var(--border-color); grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .module.open .subjects { display: grid; }

    .subject-card { background-color: var(--bg-color); border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
    .subject-top { display: flex; justify-content: space-between; align-items: center; }
    .subject-title { font-size: 14px; font-weight: 600; cursor: pointer; }
    .action-btn { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; background-color: var(--border-color); color: var(--text-muted); }
    .action-btn.available { background-color: var(--accent); color: white; }
    .edit-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; margin-right: 5px; }

    .player-section { display: none; margin-bottom: 25px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    .player-section.active { display: block; }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; background-color: #000; margin-top: 10px; }
    .video-container iframe, .video-container #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal h2 { margin-bottom: 15px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-main); }
    .form-hint { font-size: 10px; color: var(--text-muted); margin-top: 4px; display: block; }
    .error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="user-info">
        <span id="currentUserName">Carregando...</span>
        <span class="role-badge" id="userRoleTag">...</span>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="toggleTheme()">🌓 Tema</button>
        <button class="btn btn-secondary" id="btnAdmin" style="display:none;" onclick="showRegisterModal()">+ Novo Aluno</button>
        <button class="btn btn-danger" onclick="handleLogout()">Sair</button>
      </div>
    </header>

    <div class="overall-progress">
      <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
        <span>Progresso Geral do Curso</span>
        <span id="overallPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="overallBar"></div>
      </div>
    </div>

    <div class="player-section" id="playerArea">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="playerTitle" style="font-size: 16px;">Assistindo Aula</h3>
        <button class="btn btn-secondary" onclick="closePlayer()">✕ Fechar</button>
      </div>
      <div class="video-container">
        <div id="player"></div>
      </div>
      <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
        <span>Progresso do Vídeo:</span>
        <span id="simPercentText">0% assistido</span>
        <input type="hidden" id="simSlider" value="0">
      </div>
    </div>

    <div class="controls">
      <input type="text" class="search-bar" id="searchInput" placeholder="Pesquisar disciplina..." oninput="renderModules()">
    </div>

    <div id="modulesContainer"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {  
      getAuth,   
      signInWithEmailAndPassword,   
      createUserWithEmailAndPassword,   
      onAuthStateChanged,   
      signOut   
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {  
      getFirestore,   
      doc,   
      getDoc,   
      setDoc   
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALfbAdFPcn4027CjcGdEVEiJ-kCKQ_D9M",
      authDomain: "sws-ead.firebaseapp.com",
      projectId: "sws-ead",
      storageBucket: "sws-ead.firebasestorage.app",
      messagingSenderId: "175788775189",
      appId: "1:175788775189:web:8952b0f3eba14c4355bb1c"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const initialCourseData = [
      { id: 1, name: "Módulo I", subjects: [
        { id: "m1_1", name: "Teologia", playlist: null }, { id: "m1_2", name: "Trindade", playlist: null },
        { id: "m1_3", name: "Cristologia", playlist: null }, { id: "m1_4", name: "Pneumatologia", playlist: null }
      ]},
      { id: 2, name: "Módulo II", subjects: [
        { id: "m2_1", name: "Introdução Bíblica", playlist: null }, { id: "m2_2", name: "Panorama do AT", playlist: null },
        { id: "m2_3", name: "Período Interbíblico", playlist: null }, { id: "m2_4", name: "Panorama do NT", playlist: null }
      ]},
      { id: 3, name: "Módulo III", subjects: [
        { id: "m3_1", name: "Geografia Bíblica", playlist: null }, { id: "m3_2", name: "História de Israel", playlist: null },
        { id: "m3_3", name: "História da Igreja", playlist: null }, { id: "m3_4", name: "Eclesiologia", playlist: null }
      ]},
      { id: 4, name: "Módulo IV", subjects: [
        { id: "m4_1", name: "Hermenêutica", playlist: "PLYTvo-pfIcGLm0qoTU57fgRkQ7L49BHke" },
        { id: "m4_2", name: "Homilética", playlist: "PLYTvo-pfIcGLsefbBMkuzDippSDowKruJ" },
        { id: "m4_3", name: "Evangelismo", playlist: "PLYTvo-pfIcGJyW6W3p3nkJqcaeqiMp2Gv" },
        { id: "m4_4", name: "Missiologia", playlist: "PLYTvo-pfIcGK4Wb1MOFoEg6IObRbS8YxG" }
      ]},
      { id: 5, name: "Módulo V", subjects: [
        { id: "m5_1", name: "Antropologia", playlist: null }, { id: "m5_2", name: "Hamartiologia", playlist: null },
        { id: "m5_3", name: "Angelologia", playlist: null }, { id: "m5_4", name: "Família Cristã", playlist: null }
      ]},
      { id: 6, name: "Módulo VI", subjects: [
        { id: "m6_1", name: "Escatologia", playlist: null }, { id: "m6_2", name: "Soteriologia", playlist: null },
        { id: "m6_3", name: "Liturgia Cristã", playlist: null }, { id: "m6_4", name: "Língua Portuguesa", playlist: null }
      ]}
    ];

    let courseData = initialCourseData;
    let currentUser = null;
    let activeSubjectId = null;

    const $ = id => document.getElementById(id);

    async function saveCourseData() {
      try {
        await setDoc(doc(db, "cursos", "geral"), { modules: courseData });
        renderModules();
      } catch (error) {
        console.error("Erro ao salvar no Firestore:", error);
      }
    }

    async function loadCourseDataFromCloud() {
      try {
        const docRef = doc(db, "cursos", "geral");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists() && docSnap.data().modules) {
          courseData = docSnap.data().modules;
        } else {
          await setDoc(docRef, { modules: initialCourseData });
        }
      } catch (error) {
        console.error("Erro ao carregar do Firestore:", error);
      }
      renderModules();
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user.email;
        closeModal();
        setupUserSession();
      } else {
        currentUser = null;
        showLoginModal();
      }
    });

    window.closeModal = () => { $("modalOverlay").style.display = "none"; };
    window.openModal = (html) => { $("modalContent").innerHTML = html; $("modalOverlay").style.display = "flex"; };

    window.showLoginModal = () => {
      openModal(`
        <h2>Entrar na Plataforma</h2>
        <form id="formLogin">
          <div class="form-group"><label>E-mail do Aluno</label><input type="email" id="u" placeholder="seuemail@exemplo.com" required></div>
          <div class="form-group"><label>Senha</label><input type="password" id="p" required></div>
          <button class="btn btn-primary" type="submit">Acessar</button>
          <div class="error-msg" id="err">Credenciais incorretas ou usuário inexistente!</div>
        </form>
      `);
      $("formLogin").addEventListener("submit", handleLogin);
    };

    window.showRegisterModal = () => {
      openModal(`
        <h2>Cadastrar Aluno</h2>
        <form id="formRegister">
          <div class="form-group"><label>E-mail do Novo Aluno</label><input type="email" id="nu" placeholder="aluno@exemplo.com" required></div>
          <div class="form-group"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="np" required minlength="6"></div>
          <button class="btn btn-primary" type="submit" style="margin-top:10px;">Criar Usuário</button>
          <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
          <div class="error-msg" id="err">Erro ao cadastrar. Verifique os dados.</div>
        </form>
      `);
      $("formRegister").addEventListener("submit", handleRegister);
    };

    window.showLinkModal = (subId) => {
      let sub = courseData.flatMap(m => m.subjects).find(s => s.id === subId);
      openModal(`
        <h2>Editar Vídeo: ${sub.name}</h2>
        <form id="formLink">
          <div class="form-group">
            <label>Link ou ID YouTube</label>
            <input type="text" id="vLink" value="${sub.playlist || ''}">
            <span class="form-hint">Insira o link ou ID do vídeo/playlist.</span>
          </div>
          <button class="btn btn-primary" type="submit">💾 Salvar</button>
          <button class="btn btn-danger" type="button" id="btnDeleteLink">🗑️ Remover</button>
          <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
        </form>
      `);
      $("formLink").addEventListener("submit", (e) => handleSaveLink(e, subId));
      $("btnDeleteLink").addEventListener("click", () => handleDeleteLink(subId));
    };

    async function handleLogin(e) {
      e.preventDefault();
      let email = $("u").value.trim(), senha = $("p").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, senha);
        closeModal();
      } catch (error) {
        $("err").style.display = "block";
        $("err").textContent = "Erro de login: " + error.message;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      let email = $("nu").value.trim(), senha = $("np").value.trim();
      try {
        await createUserWithEmailAndPassword(auth, email, senha);
        alert(`Usuário '${email}' cadastrado com sucesso!`);
        closeModal();
      } catch (error) {
        $("err").style.display = "block";
        $("err").textContent = "Erro no cadastro: " + error.message;
      }
    }

    window.handleLogout = () => {
      signOut(auth).then(() => { location.reload(); });
    };

    async function setupUserSession() {
      $("currentUserName").textContent = currentUser;
      let isAdmin = currentUser.toLowerCase() === "infosolucoesse@gmail.com";
      $("userRoleTag").textContent = isAdmin ? "Administrador" : "Aluno";
      $("btnAdmin").style.display = isAdmin ? "inline-block" : "none";
      await loadCourseDataFromCloud();
      updateOverallProgress();
    }

    async function handleSaveLink(e, subId) {
      e.preventDefault();
      let val = $("vLink").value.trim();
      courseData.flatMap(m => m.subjects).find(s => s.id === subId).playlist = val || null;
      await saveCourseData(); 
      closeModal();
    }

    async function handleDeleteLink(subId) {
      if (!confirm("Remover o link desta aula?")) return;
      courseData.flatMap(m => m.subjects).find(s => s.id === subId).playlist = null;
      await saveCourseData(); 
      closeModal();
      if (activeSubjectId === subId) closePlayer();
    }

    const getProgress = () => JSON.parse(localStorage.getItem(`progress_${currentUser}`) || "{}");

    function setProgress(subId, val) {
      let p = getProgress(); p[subId] = parseInt(val, 10);
      localStorage.setItem(`progress_${currentUser}`, JSON.stringify(p));
      updateOverallProgress(); renderModules();
    }

    function updateOverallProgress() {
      let p = getProgress(), subs = courseData.flatMap(m => m.subjects);
      let sum = subs.reduce((acc, s) => acc + (p[s.id] || 0), 0);
      let total = Math.round(sum / subs.length) || 0;
      $("overallBar").style.width = total + "%";
      $("overallPercent").textContent = total + "%";
    }

    window.renderModules = () => {
      let search = $("searchInput").value.toLowerCase().trim();
      let isAdmin = currentUser?.toLowerCase() === "infosolucoesse@gmail.com";
      let prog = getProgress();
      let html = "";

      courseData.forEach(m => {
        let filtered = m.subjects.filter(s => s.name.toLowerCase().includes(search));
        if (search && !filtered.length) return;

        let subs = search ? filtered : m.subjects;
        let subsHtml = subs.map(s => {
          let p = prog[s.id] || 0, avail = Boolean(s.playlist);
          return `
            <div class="subject-card">
              <div class="subject-top">
                <span class="subject-title" onclick="openSubject('${s.id}')">${s.name}</span>
                <div>
                  ${isAdmin ? `<button class="edit-btn" onclick="showLinkModal('${s.id}')">⚙️ Link</button>` : ''}
                  <button class="action-btn ${avail ? 'available' : ''}" onclick="openSubject('${s.id}')">
                    ${avail ? '▶ Assistir' : 'Indisponível'}
                  </button>
                </div>
              </div>
              <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
                <span>Progresso</span><span>${p}%</span>
              </div>
            </div>
          `;
        }).join("");

        html += `
          <div class="module ${search ? 'open' : ''}" id="mod-${m.id}">
            <button class="module-toggle" onclick="document.getElementById('mod-${m.id}').classList.toggle('open')">
              <span>📌 ${m.name}</span><span>▼</span>
            </button>
            <div class="subjects">${subsHtml}</div>
          </div>
        `;
      });
      $("modulesContainer").innerHTML = html;
    };

    let ytPlayer = null;
    let progressInterval = null;
    let pendingSubjectId = null;

    if (!window.YT) {
      let tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      let firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    window.onYouTubeIframeAPIReady = () => {
      if (pendingSubjectId) {
        window.openSubject(pendingSubjectId);
        pendingSubjectId = null;
      }
    };

    window.openSubject = (subId) => {
      let sub = courseData.flatMap(m => m.subjects).find(s => s.id === subId);
      if (!sub || !sub.playlist) return alert("Conteúdo indisponível.");

      if (typeof YT === "undefined" || !YT.Player) {
        pendingSubjectId = subId;
        return;
      }

      activeSubjectId = subId;
      let raw = sub.playlist;
      let videoId = "";
      let playlistId = "";

      if (raw.includes("list=") || raw.startsWith("PL")) {
        playlistId = raw.includes("list=") ? raw.split("list=")[1].split("&")[0] : raw;
      } else {
        videoId = raw.includes("v=") ? raw.split("v=")[1].split("&")[0] : raw;
      }

      $("playerTitle").textContent = sub.name;
      $("playerArea").classList.add("active");
      $("playerArea").scrollIntoView({ behavior: "smooth" });

      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        ytPlayer.destroy();
      }

      let playerVarsConfig = { autoplay: 1, rel: 0 };
      if (playlistId) {
        playerVarsConfig.listType = 'playlist';
        playerVarsConfig.list = playlistId;
      }

      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId || undefined,
        playerVars: playerVarsConfig,
        events: { 'onStateChange': onPlayerStateChange }
      });

      let p = getProgress()[subId] || 0;
      $("simSlider").value = p;
      $("simPercentText").textContent = p + "% assistido";
    };

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startProgressTracker();
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        stopProgressTracker();
        calculateAndUpdateProgress();
      }
    }

    function startProgressTracker() {
      stopProgressTracker();
      progressInterval = setInterval(() => {
        calculateAndUpdateProgress();
      }, 1000);
    }

    function stopProgressTracker() {
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
    }

    function calculateAndUpdateProgress() {
      if (!ytPlayer || !ytPlayer.getDuration || !activeSubjectId) return;
      let duration = ytPlayer.getDuration();
      let currentTime = ytPlayer.getCurrentTime();

      if (duration > 0) {
        let percent = Math.min(100, Math.round((currentTime / duration) * 100));
        $("simSlider").value = percent;
        $("simPercentText").textContent = percent + "% assistido";
        
        let currentSaved = getProgress()[activeSubjectId] || 0;
        if (percent > currentSaved) {
          setProgress(activeSubjectId, percent);
        }
      }
    }

    window.closePlayer = () => {
      stopProgressTracker();
      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        ytPlayer.destroy();
      }
      $("playerArea").classList.remove("active");
      activeSubjectId = null;
    };

    window.toggleTheme = () => {
      let t = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    };
  </script>
</body>
</html>
