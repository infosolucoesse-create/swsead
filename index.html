<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curso Básico de Teologia - Plataforma de Estudos</title>
<style>
:root {
  --bg: #f4f6fa; --card: #ffffff; --text: #1a202c; --text-muted: #718096;
  --primary: #1e3a8a; --primary-hover: #1e40af; --accent: #d97706;
  --border: #e2e8f0; --danger: #dc2626; --radius: 12px;
  --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
}
[data-theme="dark"] {
  --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8;
  --primary: #3b82f6; --primary-hover: #60a5fa; --border: #334155;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

/* Modais */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
.modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; padding: 28px 24px; text-align: center; }
.modal-card h2 { margin: 0 0 8px; color: var(--primary); font-size: 20px; }
.modal-card p { margin: 0 0 18px; color: var(--text-muted); font-size: 13px; }
.form-group { margin-bottom: 14px; text-align: left; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: block; }
.btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 6px; font-size: 14px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: #64748b; color: #fff; }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }

/* Header & Structure */
header { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: #fff; padding: 20px; }
.header-top { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.user-tag { background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 20px; font-size: 13px; }
.btn-sm { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
.container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.progress-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
.search-box input { width: 100%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none; }

/* Modules & Cards */
.modules { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.module { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.module-toggle { width: 100%; border: 0; background: none; text-align: left; padding: 16px; cursor: pointer; color: inherit; display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; }
.subjects { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.module.open .subjects { display: block; }
.subject-card { display: flex; flex-direction: column; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; padding: 10px 12px; }
.subject-top { display: flex; justify-content: space-between; align-items: center; }
.subject-title { font-weight: 600; font-size: 14px; cursor: pointer; }
.action-btn { background: var(--card); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text); }
.action-btn.available { background: var(--primary); color: #fff; border-color: var(--primary); }
.edit-btn { background: rgba(217,119,6,0.15); border: 1px solid var(--accent); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }

/* Player */
.player-area { display: none; margin-top: 24px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.player-area.active { display: block; }
.player-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.video-container { position: relative; padding-top: 56.25%; background: #000; }
.video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.video-controls { padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border); }
</style>
</head>
<body>

<!-- MODAL GENÉRICO DINÂMICO -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalContent"></div>
</div>

<header>
  <div class="header-top">
    <div>Bem-vindo, <strong id="currentUserName">Carregando...</strong> <span class="user-tag" id="userRoleTag">...</span></div>
    <div style="display:flex; gap:8px;">
      <button class="btn-sm" id="btnAdmin" onclick="showRegisterModal()" style="display:none;">+ Usuário</button>
      <button class="btn-sm" onclick="toggleTheme()">🌙 Tema</button>
      <button class="btn-sm" onclick="handleLogout()">🚪 Sair</button>
    </div>
  </div>
  <h1 style="text-align:center; margin:15px 0 0; font-size:24px;">Curso Básico de Teologia</h1>
</header>

<main class="container">
  <div class="dashboard-grid">
    <div class="card">
      <div style="display:flex; justify-content:space-between; font-weight:700; font-size:12px; color:var(--text-muted);">
        <span>PROGRESSO GERAL</span><span id="overallPercent" style="color:var(--primary); font-size:16px;">0%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="overallBar"></div></div>
    </div>
    <div class="card search-box">
      <input type="text" id="searchInput" placeholder="Buscar matéria..." oninput="renderModules()">
    </div>
  </div>

  <section class="modules" id="modulesContainer"></section>

  <section class="player-area" id="playerArea">
    <div class="player-header">
      <h3 id="playerTitle" style="margin:0;">Aula</h3>
      <button class="btn-sm" style="background:var(--danger); border:none;" onclick="closePlayer()">✕ Fechar</button>
    </div>
    <div class="video-container">
      <iframe id="player" src="" allowfullscreen></iframe>
    </div>
    <div class="video-controls">
      <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600;">
        <span>⏱️ Progresso da Aula</span><span id="simPercentText">0% assistido</span>
      </div>
      <input type="range" min="0" max="100" value="0" style="width:100%; accent-color:var(--primary);" id="simSlider" oninput="updateVideoProgress(this.value)">
    </div>
  </section>
</main>

<script type="module">
  // 1. IMPORTAÇÃO DO FIREBASE (v10+)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // 2. COLE SUAS CONFIGURAÇÕES DO FIREBASE CONSOLE AQUI
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const initialCourseData = [
    { id: 1, name: "Módulo I", subjects: [
      { id: "m1_1", name: "Teologia", playlist: null }, { id: "m1_2", name: "Trindade", playlist: null },
      { id: "m1_3", name: "Cristologia", playlist: null }, { id: "m1_4", name: "Pneumatologia", playlist: null }
    ]},
    { id: 2, name: "Módulo II", subjects: [
      { id: "m2_1", name: "Introdução Bíblica", playlist: null }, { id: "m2_2", name: "Panorama do AT", playlist: null },
      { id: "m2_3", name: "Período Interbíblico", playlist: null }, { id: "m2_4", name: "Panorama do NT", playlist: null }
    ]},
    { id: 3, name: "Módulo III", subjects: [
      { id: "m3_1", name: "Geografia Bíblica", playlist: null }, { id: "m3_2", name: "História de Israel", playlist: null },
      { id: "m3_3", name: "História da Igreja", playlist: null }, { id: "m3_4", name: "Eclesiologia", playlist: null }
    ]},
    { id: 4, name: "Módulo IV", subjects: [
      { id: "m4_1", name: "Hermenêutica", playlist: "PLYTvo-pfIcGLm0qoTU57fgRkQ7L49BHke" },
      { id: "m4_2", name: "Homilética", playlist: "PLYTvo-pfIcGLsefbBMkuzDippSDowKruJ" },
      { id: "m4_3", name: "Evangelismo", playlist: "PLYTvo-pfIcGJyW6W3p3nkJqcaeqiMp2Gv" },
      { id: "m4_4", name: "Missiologia", playlist: "PLYTvo-pfIcGK4Wb1MOFoEg6IObRbS8YxG" }
    ]},
    { id: 5, name: "Módulo V", subjects: [
      { id: "m5_1", name: "Antropologia", playlist: null }, { id: "m5_2", name: "Hamartiologia", playlist: null },
      { id: "m5_3", name: "Angelologia", playlist: null }, { id: "m5_4", name: "Família Cristã", playlist: null }
    ]},
    { id: 6, name: "Módulo VI", subjects: [
      { id: "m6_1", name: "Escatologia", playlist: null }, { id: "m6_2", name: "Soteriologia", playlist: null },
      { id: "m6_3", name: "Liturgia Cristã", playlist: null }, { id: "m6_4", name: "Língua Portuguesa", playlist: null }
    ]}
  ];

  let courseData = JSON.parse(localStorage.getItem("course_data") || JSON.stringify(initialCourseData));
  let currentUser = null;
  let activeSubjectId = null;

  const $ = id => document.getElementById(id);
  const saveCourseData = () => localStorage.setItem("course_data", JSON.stringify(courseData));

  // MONITORAR STATUS DE AUTENTICAÇÃO DO FIREBASE (SESSÃO EM NUVEM)
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user.email;
      closeModal();
      setupUserSession();
    } else {
      currentUser = null;
      showLoginModal();
    }
  });

  /* MODAIS RENDER */
  window.closeModal = () => { $("modalOverlay").style.display = "none"; };
  window.openModal = (html) => { $("modalContent").innerHTML = html; $("modalOverlay").style.display = "flex"; };

  window.showLoginModal = () => {
    openModal(`
      <h2>Entrar na Plataforma</h2>
      <form id="formLogin">
        <div class="form-group"><label>E-mail do Aluno</label><input type="email" id="u" placeholder="seuemail@exemplo.com" required></div>
        <div class="form-group"><label>Senha</label><input type="password" id="p" required></div>
        <button class="btn btn-primary" type="submit">Acessar</button>
        <div class="error-msg" id="err">Credenciais incorretas ou usuário inexistente!</div>
      </form>
    `);
    
    $("formLogin").addEventListener("submit", handleLogin);
  };

  window.showRegisterModal = () => {
    openModal(`
      <h2>Cadastrar Aluno</h2>
      <form id="formRegister">
        <div class="form-group"><label>E-mail do Novo Aluno</label><input type="email" id="nu" placeholder="aluno@exemplo.com" required></div>
        <div class="form-group"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="np" required minlength="6"></div>
        <button class="btn btn-primary" type="submit">Criar Usuário</button>
        <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
        <div class="error-msg" id="err">Erro ao cadastrar. Verifique os dados.</div>
      </form>
    `);

    $("formRegister").addEventListener("submit", handleRegister);
  };

  window.showLinkModal = (subId) => {
    let sub = courseData.flatMap(m => m.subjects).find(s => s.id === subId);
    openModal(`
      <h2>Editar Vídeo: ${sub.name}</h2>
      <form id="formLink">
        <div class="form-group">
          <label>Link ou ID YouTube</label>
          <input type="text" id="vLink" value="${sub.playlist || ''}">
          <span class="form-hint">Insira o link ou ID do vídeo/playlist.</span>
        </div>
        <button class="btn btn-primary" type="submit">💾 Salvar</button>
        <button class="btn btn-danger" type="button" id="btnDeleteLink">🗑️ Remover</button>
        <button class="btn btn-secondary" type="button" onclick="closeModal()">Cancelar</button>
      </form>
    `);

    $("formLink").addEventListener("submit", (e) => handleSaveLink(e, subId));
    $("btnDeleteLink").addEventListener("click", () => handleDeleteLink(subId));
  };

  /* HANDLERS AUTENTICAÇÃO FIREBASE */
  async function handleLogin(e) {
    e.preventDefault();
    let email = $("u").value.trim(), senha = $("p").value.trim();
    try {
      await signInWithEmailAndPassword(auth, email, senha);
      closeModal();
    } catch (error) {
      console.error(error);
      $("err").style.display = "block";
      $("err").textContent = "Erro de login: " + error.message;
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    let email = $("nu").value.trim(), senha = $("np").value.trim();
    try {
      await createUserWithEmailAndPassword(auth, email, senha);
      alert(`Usuário '${email}' cadastrado com sucesso no Firebase!`);
      closeModal();
    } catch (error) {
      console.error(error);
      $("err").style.display = "block";
      $("err").textContent = "Erro no cadastro: " + error.message;
    }
  }

  window.handleLogout = () => {
    signOut(auth).then(() => {
      location.reload();
    });
  };

  function setupUserSession() {
    $("currentUserName").textContent = currentUser;
    // Define como Admin se o e-mail começar com sws
    let isSWS = currentUser.toLowerCase().includes("sws");
    $("userRoleTag").textContent = isSWS ? "Administrador" : "Aluno";
    $("btnAdmin").style.display = isSWS ? "inline-block" : "none";
    renderModules();
    updateOverallProgress();
  }

  function handleSaveLink(e, subId) {
    e.preventDefault();
    let val = $("vLink").value.trim();
    courseData.flatMap(m => m.subjects).find(s => s.id === subId).playlist = val || null;
    saveCourseData(); closeModal(); renderModules();
  }

  function handleDeleteLink(subId) {
    if (!confirm("Remover o link desta aula?")) return;
    courseData.flatMap(m => m.subjects).find(s => s.id === subId).playlist = null;
    saveCourseData(); closeModal(); renderModules();
    if (activeSubjectId === subId) closePlayer();
  }

  /* PROGRESSO E INTERFACE */
  const getProgress = () => JSON.parse(localStorage.getItem(`progress_${currentUser}`) || "{}");

  function setProgress(subId, val) {
    let p = getProgress(); p[subId] = parseInt(val, 10);
    localStorage.setItem(`progress_${currentUser}`, JSON.stringify(p));
    updateOverallProgress(); renderModules();
  }

  function updateOverallProgress() {
    let p = getProgress(), subs = courseData.flatMap(m => m.subjects);
    let sum = subs.reduce((acc, s) => acc + (p[s.id] || 0), 0);
    let total = Math.round(sum / subs.length) || 0;
    $("overallBar").style.width = total + "%";
    $("overallPercent").textContent = total + "%";
  }

  window.renderModules = () => {
    let search = $("searchInput").value.toLowerCase().trim();
    let isSWS = currentUser?.toLowerCase().includes("sws");
    let prog = getProgress();
    let html = "";

    courseData.forEach(m => {
      let filtered = m.subjects.filter(s => s.name.toLowerCase().includes(search));
      if (search && !filtered.length) return;

      let subs = search ? filtered : m.subjects;
      let subsHtml = subs.map(s => {
        let p = prog[s.id] || 0, avail = Boolean(s.playlist);
        return `
          <div class="subject-card">
            <div class="subject-top">
              <span class="subject-title" onclick="openSubject('${s.id}')">${s.name}</span>
              <div>
                ${isSWS ? `<button class="edit-btn" onclick="showLinkModal('${s.id}')">⚙️ Link</button>` : ''}
                <button class="action-btn ${avail ? 'available' : ''}" onclick="openSubject('${s.id}')">
                  ${avail ? '▶ Assistir' : 'Indisponível'}
                </button>
              </div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
              <span>Progresso</span><span>${p}%</span>
            </div>
          </div>
        `;
      }).join("");

      html += `
        <div class="module ${search ? 'open' : ''}" id="mod-${m.id}">
          <button class="module-toggle" onclick="document.getElementById('mod-${m.id}').classList.toggle('open')">
            <span>📌 ${m.name}</span><span>▼</span>
          </button>
          <div class="subjects">${subsHtml}</div>
        </div>
      `;
    });
    $("modulesContainer").innerHTML = html;
  };

  /* PLAYER */
  window.openSubject = (subId) => {
    let sub = courseData.flatMap(m => m.subjects).find(s => s.id === subId);
    if (!sub || !sub.playlist) return alert("Conteúdo indisponível.");

    activeSubjectId = subId;
    let raw = sub.playlist, embed = "";
    if (raw.includes("list=") || raw.startsWith("PL")) {
      let listId = raw.includes("list=") ? raw.split("list=")[1].split("&")[0] : raw;
      embed = `https://www.youtube.com/embed/videoseries?list=${listId}`;
    } else {
      let vidId = raw.includes("v=") ? raw.split("v=")[1].split("&")[0] : raw;
      embed = `https://www.youtube.com/embed/${vidId}`;
    }

    $("playerTitle").textContent = sub.name;
    $("player").src = embed;
    let p = getProgress()[subId] || 0;
    $("simSlider").value = p;
    $("simPercentText").textContent = p + "% assistido";
    $("playerArea").classList.add("active");
    $("playerArea").scrollIntoView({ behavior: "smooth" });
  };

  window.closePlayer = () => {
    $("playerArea").classList.remove("active");
    $("player").src = "";
    activeSubjectId = null;
  };

  window.updateVideoProgress = (v) => {
    if (!activeSubjectId) return;
    $("simPercentText").textContent = v + "% assistido";
    setProgress(activeSubjectId, v);
  };

  window.toggleTheme = () => {
    let t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  };
</script>
</body>
</html>
