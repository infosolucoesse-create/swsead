    function parseYouTubeUrl(url) {
      if (!url) return { videoId: "", playlistId: "" };
      let str = url.trim();
      let playlistId = "";
      let videoId = "";

      if (str.includes("list=")) {
        playlistId = str.split("list=")[1].split("&")[0];
      } else if (str.startsWith("PL")) {
        playlistId = str;
      }

      if (str.includes("youtu.be/")) {
        videoId = str.split("youtu.be/")[1].split("?")[0].split("&")[0];
      } else if (str.includes("v=")) {
        videoId = str.split("v=")[1].split("&")[0];
      } else if (!playlistId && str.length === 11) {
        videoId = str;
      }

      return { videoId, playlistId };
    }

    function getAllLessons() {
      let list = [];
      courseData.forEach(m => {
        if (m.materias) {
          m.materias.forEach(mat => {
            if (mat.lessons) {
              mat.lessons.forEach(l => {
                list.push({ ...l, materiaTitle: mat.title });
              });
            }
          });
        }
      });
      return list;
    }

    function isMateriaCompleted(mat) {
      const prog = getProgress();
      const lessons = mat.lessons || [];
      if (!lessons.length) return false;
      return lessons.every(l => (prog[l.id] || 0) >= 100);
    }

    // Versão da estrutura do curso. Se o curso salvo tiver versão menor, as aulas dos módulos II a VI
    // são substituídas pelas do código (uma única vez). Depois disso, links novos nunca são sobrescritos.
    const ESTRUTURA_VERSAO = 2;
    const MODULOS_SOBRESCRITOS = [2, 3, 4, 5, 6];

    // Aulas provisórias antigas (uma só por matéria): são removidas; se tinham link, ele passa para o Capítulo 1 correspondente
    const AULA_PROVISORIA_PARA = { m1_cristo_1: "m1_cristo_cap1", m1_pneumat_1: "m1_pneumat_cap1", m1_etica_1: "m1_etica_cap1" };

    // Completa o curso salvo na nuvem com módulos, matérias e aulas novas do código,
    // sem apagar nenhum link nem prova já cadastrados.
    function mergeCourseData(saved, initial, versaoSalva = 0) {
      const sobrescrever = versaoSalva < ESTRUTURA_VERSAO;
      const out = JSON.parse(JSON.stringify(saved));
      initial.forEach(im => {
        const sm = out.find(m => m.id === im.id);
        if (!sm) { out.push(JSON.parse(JSON.stringify(im))); return; }
        sm.materias = sm.materias || [];
        im.materias.forEach(imat => {
          const smat = sm.materias.find(x => x.id === imat.id);
          if (!smat) { sm.materias.push(JSON.parse(JSON.stringify(imat))); return; }
          if (sobrescrever && MODULOS_SOBRESCRITOS.includes(im.id)) {
            smat.lessons = JSON.parse(JSON.stringify(imat.lessons));
            return;
          }
          const provisorias = (smat.lessons || []).filter(l => AULA_PROVISORIA_PARA[l.id]);
          const atuais = (smat.lessons || []).filter(l => !AULA_PROVISORIA_PARA[l.id]);
          const ordenadas = imat.lessons.map(il => atuais.find(l => l.id === il.id) || JSON.parse(JSON.stringify(il)));
          provisorias.forEach(pv => {
            const alvo = ordenadas.find(l => l.id === AULA_PROVISORIA_PARA[pv.id]);
            if (alvo && !alvo.playlist && pv.playlist) alvo.playlist = pv.playlist;
          });
          const extras = atuais.filter(l => !imat.lessons.some(il => il.id === l.id));
          smat.lessons = [...ordenadas, ...extras];
        });
      });
      return out;
    }

    async function loadCourseDataFromCloud() {
      try {
        const docRef = doc(db, "cursos", "geral_v3");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists() && docSnap.data().modules) {
          const salvo = docSnap.data().modules;
          const versaoSalva = docSnap.data().estruturaVersao || 0;
          courseData = mergeCourseData(salvo, initialCourseData, versaoSalva);
          // O administrador grava o curso já completo; os alunos apenas veem a versão mesclada
          const souAdmin = ehSuperAdmin();
          if (souAdmin && (versaoSalva < ESTRUTURA_VERSAO || JSON.stringify(courseData) !== JSON.stringify(salvo))) {
            await setDoc(docRef, { modules: courseData, estruturaVersao: ESTRUTURA_VERSAO });
          }
        } else {
          await setDoc(docRef, { modules: initialCourseData, estruturaVersao: ESTRUTURA_VERSAO });
        }
      } catch (error) {
        console.error("Erro ao carregar do Firestore:", error);
      }
      renderModules();
    }

    let progressCache = {};

    const getProgress = () => progressCache;

    const progressRef = () => doc(db, "progresso", auth.currentUser.uid);

    async function loadProgressFromCloud() {
      if (!auth.currentUser) return;
      let local = {};
      try { local = JSON.parse(localStorage.getItem(`progress_${currentUser}`) || "{}"); } catch {}

      let cloud = {};
      let cloudOk = true;
      try {
        const snap = await getDoc(progressRef());
        if (snap.exists()) { cloud = snap.data().aulas || {}; provasEstado = snap.data().provas || {}; }
      } catch (err) {
        cloudOk = false;
        console.error("Erro ao carregar progresso:", err);
      }

      const merged = { ...cloud };
      for (const [id, v] of Object.entries(local)) {
        merged[id] = Math.max(merged[id] || 0, v);
      }
      // O progresso da aula provisória antiga passa para o Capítulo 1 correspondente
      // e a chave antiga é REMOVIDA para não deixar lixo.
      for (const [antigo, novoId] of Object.entries(AULA_PROVISORIA_PARA)) {
        if ((merged[antigo] || 0) > (merged[novoId] || 0)) merged[novoId] = merged[antigo];
        delete merged[antigo];
      }
      // Corrige aulas que ficaram travadas em 99% por arredondamento: passam a 100%
      for (const [id, v] of Object.entries(merged)) {
        if (v >= 99 && v < 100) merged[id] = 100;
      }
      progressCache = merged;
      localStorage.setItem(`progress_${currentUser}`, JSON.stringify(progressCache));

      provasCarregadas = cloudOk;
      if (cloudOk) {
        progressDirty = true;
        await flushProgress();
      }
    }

    async function flushProgress() {
      clearTimeout(progressTimer);

      } catch (err) {
        progressDirty = true;
        console.error("Erro ao salvar progresso:", err);
      }
    }

          const dados = dadosDoAluno(email, acesso);
          const provasData = data.provas || {};
          const notasFinais = {};
          todasMaterias().forEach(({ mat }) => {
            const n = notaFinalMateria(mat.id, acesso?.notas, provasData);
            if (typeof n === "number") notasFinais[mat.id] = n;
          });
          const valoresNotas = Object.values(notasFinais);
          return {
            provas: provasData,
            provasParciais: Object.values(provasData).filter(e => (e?.prova ? 1 : 0) + (e?.caderno ? 1 : 0) === 1).length,
            notasFinais,
            notas: acesso?.notas || {},
            qtdNotas: valoresNotas.length,

            andamento: lessons.filter(l => { const v = aulas[l.id] || 0; return v > 0 && v < 100; }).length,
            ultimo: data.atualizadoEm || 0,
            aulas
          };
        }).sort((a, b) => b.geral - a.geral || a.nome.localeCompare(b.nome));

      } catch (err) {

    // ===== Exportação (CSV com separador ";" e acentos corretos no Excel) =====
    function csvCelula(v) {
      let t = String(v ?? "");
      // evita que o Excel interprete o texto como fórmula
      if (/^[=+\-@]/.test(t) && !/^\+?\d[\d\s().-]*$/.test(t)) t = "'" + t;
      return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    }

    function baixarCsv(nomeArquivo, linhas) {
      const csv = "\uFEFF" + linhas.map(l => l.map(csvCelula).join(";")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function quandoTexto(ts) {
      return ts ? new Date(ts).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
    }

    function dataArquivo() { return new Date().toISOString().slice(0, 10); }

    function nomeArquivoSeguro(t) {
      return String(t || "aluno").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").toLowerCase() || "aluno";
    }

    // ===== Exportação em PDF (jsPDF + AutoTable, carregados só quando necessário) =====
    const JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    const AUTOTABLE_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";
    let pdfLibPronta = null;

    function carregarScript(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement("script");
        el.src = src;
        el.onload = resolve;
        el.onerror = () => reject(new Error("Falha ao carregar " + src));
        document.head.appendChild(el);
      });
    }

    function garantirPdfLib() {
      if (window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
      if (!pdfLibPronta) {
        pdfLibPronta = carregarScript(JSPDF_URL).then(() => carregarScript(AUTOTABLE_URL)).catch(err => { pdfLibPronta = null; throw err; });
      }
      return pdfLibPronta;
    }

    const PDF_AZUL = [26, 68, 173];

    function pdfCabecalho(doc, subtitulo) {
      const w = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.setTextColor(...PDF_AZUL);
      doc.text("SEMINÁRIO EAD - SWS", w / 2, 16, { align: "center" });
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(80, 80, 80);
      doc.text(subtitulo, w / 2, 22, { align: "center" });
      doc.setDrawColor(...PDF_AZUL);
      doc.setLineWidth(0.6);
      doc.line(14, 26, w - 14, 26);
    }

    function pdfRodape(doc) {
      const n = doc.getNumberOfPages();
      const w = doc.internal.pageSize.getWidth();
      const h = doc.internal.pageSize.getHeight();
      const quando = new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
      for (let i = 1; i <= n; i++) {
        doc.setPage(i);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.setDrawColor(...PDF_AZUL);
        doc.setLineWidth(0.3);
        doc.line(14, h - 12, w - 14, h - 12);
        doc.text("Gerado em " + quando, 14, h - 7);
        doc.text("Página " + i + " de " + n, w - 14, h - 7, { align: "right" });
      }
    }

              else { d.cell.styles.textColor = [150, 150, 150]; }
            }
